services:
  - type: web_service
    name: budget-tracker
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    disk: 1024
    envVars:
      - key: NODE_ENV
        value: production
      # Set these as secrets in the Render dashboard - do not commit real values.
      - key: MONGODB_URI
        sync: false
      # Optional: defaults to "budget_tracker" in production, keeping it separate from local dev's "budget_tracker_dev".
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BUDGET_TRACKER_USERNAME
        sync: false
      - key: BUDGET_TRACKER_PASSWORD
        sync: false
